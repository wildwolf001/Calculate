# 语义层：业务口径的唯一事实来源。
# 修改口径只改这里；编译器不包含任何业务判断。
# 时间区间统一为 [start, end)，与 SQL 半开区间一致。
version: 4
dataset: ecommerce_agent_demo
compiler_version: 1
time_range: ["2024-01-01", "2025-12-26"]
default_year: latest_occurrence

tables:
  orders:
    grain: [order_id]
    time: purchase_at
    columns: [order_id, customer_id, order_status, purchase_at, approved_at, shipped_at, delivered_at, estimated_delivery_at]
  order_items:
    grain: [order_id, order_item_id]
    columns: [order_id, order_item_id, product_id, seller_id, shipping_limit_at, price, freight_value]
  order_payments:
    grain: [order_id, payment_sequence]
    columns: [order_id, payment_sequence, payment_type, payment_installments, payment_value]
  order_reviews:
    grain: [review_id]
    columns: [review_id, order_id, review_score, review_title, review_message, review_created_at, seller_answered_at]
  products:
    grain: [product_id]
    columns: [product_id, category_id, product_name, base_price]
  categories:
    grain: [category_id]
    columns: [category_id, category_name_en, category_name_zh]
  sellers:
    grain: [seller_id]
    columns: [seller_id, seller_name, seller_city, seller_state]
  customers:
    grain: [customer_id]
    columns: [customer_id, customer_unique_id, customer_zip_code, customer_city, customer_state]
  geolocation:
    grain: [zip_code]
    columns: [zip_code, latitude, longitude, city, state]

# 所有 join 均为 N:1（或 1:1），从事实表指向维度表；
# 编译器据此保证不会因 join 放大行数。
joins:
  order_items:
    orders:     { "on": order_id,    card: "N:1" }
    products:   { "on": product_id,  card: "N:1" }
    sellers:    { "on": seller_id,   card: "N:1" }
  products:
    categories: { "on": category_id, card: "N:1" }
  orders:
    customers:  { "on": customer_id, card: "N:1" }
  order_reviews:
    orders:     { "on": order_id,    card: "N:1" }
  order_payments:
    orders:     { "on": order_id,    card: "N:1" }

# 支付类指标必须先按订单预聚合，再与订单关联。
pre_aggregates:
  payment_by_order:
    fact: order_payments
    key: order_id
    measures:
      payment_value: SUM(payment_value)

metrics:
  gmv:
    name_zh: 商品销售额
    type: aggregate
    fact: order_items
    expr: SUM(order_items.price)
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: true
    unit: 元
    supported_grain: [none, month, category, seller, product, state, city, seller_state]
    synonyms: [商品销售额, 销售额, GMV, 营收, 成交额, 卖了多少钱]
    excludes: [freight_value]
    definition: 已送达订单的订单明细 price 合计，不含运费。

  freight_total:
    name_zh: 运费
    type: aggregate
    fact: order_items
    expr: SUM(order_items.freight_value)
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: true
    unit: 元
    supported_grain: [none, month, category, seller, product, state, city, seller_state]
    synonyms: [运费, 物流费, 快递费, 配送费]
    definition: 已送达订单的订单明细 freight_value 合计；与商品销售额分开统计。

  item_count:
    name_zh: 商品件数
    type: aggregate
    fact: order_items
    expr: COUNT(order_items.order_item_id)
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: true
    unit: 件
    supported_grain: [none, month, category, seller, product, state, city, seller_state]
    synonyms: [商品件数, 销量, 件数]
    definition: 已送达订单的明细行数（每行一件商品）。

  product_count:
    name_zh: 商品款数
    type: aggregate
    fact: order_items
    expr: COUNT(DISTINCT order_items.product_id)
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: false
    unit: 款
    supported_grain: [none, month, category, seller, state, city, seller_state]
    synonyms: [商品款数, 款数, 几款, 多少款, 单品数, 商品数]
    definition: 已送达订单中出现过的不同商品数（按 product_id 去重）；只统计有成交的商品。

  order_count:
    name_zh: 订单数
    type: aggregate
    fact: orders
    expr: COUNT(DISTINCT orders.order_id)
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: false
    unit: 笔
    supported_grain: [none, month, category, seller, state, city, seller_state, payment_type]
    synonyms: [订单数, 已送达订单数, 订单量, 多少笔订单]
    definition: 已送达订单按 order_id 去重计数。

  paid_amount:
    name_zh: 支付金额
    type: aggregate
    fact: order_payments
    pre_aggregate: payment_by_order
    expr: SUM(payment_value)
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: true
    unit: 元
    supported_grain: [none, month, state, city, payment_type, order_status]
    filter_grain: [none, month, state, city, payment_type, order_status]
    synonyms: [支付金额, 实付金额, 付款金额]
    definition: 先按订单汇总 payment_value，再与订单关联求和。
    caveats:
      - 支付金额 = 商品金额 + 运费，本数据集实测勾稽差异为 0。
      - 支付表无时间戳，时间归属使用 orders.purchase_at。
      - 支付金额无法按品类/商家拆分（未做支付分摊）。

  delay_rate:
    name_zh: 延迟率
    type: ratio
    fact: orders
    ratio_grain: order
    numerator: COUNT(DISTINCT CASE WHEN orders.delivered_at > orders.estimated_delivery_at THEN orders.order_id END)
    denominator: COUNT(DISTINCT orders.order_id)
    grain_numerator: MAX(CASE WHEN orders.delivered_at > orders.estimated_delivery_at THEN 1 ELSE 0 END)
    grain_denominator: "1"
    numerator_label: 延迟订单数
    denominator_label: 已送达订单数
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: false
    unit: "%"
    supported_grain: [none, month, category, seller, state, city, seller_state]
    synonyms: [延迟率, 迟到率, 延期率]
    definition: 延迟的已送达订单数 / 已送达订单数；必须先聚合到订单粒度。

  late_order_count:
    name_zh: 延迟订单数
    type: aggregate
    fact: orders
    expr: COUNT(DISTINCT CASE WHEN orders.delivered_at > orders.estimated_delivery_at THEN orders.order_id END)
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: false
    unit: 笔
    supported_grain: [none, month, category, seller, state, city, seller_state]
    synonyms: [延迟订单数, 迟到订单数]
    definition: delivered_at 晚于 estimated_delivery_at 的已送达订单数（按订单去重）。

  avg_review_score:
    name_zh: 平均评分
    type: aggregate
    fact: order_reviews
    expr: AVG(order_reviews.review_score)
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: false
    unit: 分
    supported_grain: [none, month, state, city, late, low_score]
    synonyms: [平均评分, 平均分, 评分, 满意度]
    coverage_note: 仅覆盖有评价的已送达订单（约 86.17%）。
    definition: 已送达订单的评价分数均值。

  low_score_rate:
    name_zh: 低分率
    type: ratio
    fact: order_reviews
    ratio_grain: review
    numerator: COUNT(CASE WHEN order_reviews.review_score <= 2 THEN 1 END)
    denominator: COUNT(order_reviews.review_id)
    grain_numerator: MAX(CASE WHEN order_reviews.review_score <= 2 THEN 1 ELSE 0 END)
    grain_denominator: "1"
    numerator_label: 低分评价数
    denominator_label: 评价数
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: false
    unit: "%"
    supported_grain: [none, month, state, city, late, low_score]
    synonyms: [低分率, 差评率]
    coverage_note: 仅覆盖有评价的已送达订单（约 86.17%）。
    definition: review_score <= 2 的评价占全部评价的比例。

  review_count:
    name_zh: 评价数
    type: aggregate
    fact: order_reviews
    expr: COUNT(order_reviews.review_id)
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: true
    unit: 条
    supported_grain: [none, month, state, city, late, low_score]
    synonyms: [评价数, 评价条数, 评论数]
    coverage_note: 仅覆盖有评价的已送达订单（约 86.17%）。
    definition: 已送达订单的评价条数。

  customer_count:
    name_zh: 购买客户数
    type: aggregate
    fact: orders
    expr: COUNT(DISTINCT customers.customer_unique_id)
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: false
    unit: 人
    supported_grain: [none, month, state, city]
    synonyms: [客户数, 购买客户数, 人数, 买家数]
    definition: 已送达订单的自然客户数（按 customer_unique_id 去重）。

  repeat_customer_count:
    name_zh: 复购客户数
    type: entity_count
    fact: orders
    entity: customers.customer_unique_id
    entity_join: orders -> customers
    count_orders: COUNT(DISTINCT orders.order_id)
    min_orders: 2
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: false
    unit: 人
    supported_grain: [none]
    synonyms: [复购客户数, 复购人数, 回头客]
    definition: 同一 customer_unique_id 完成至少 2 笔已送达订单的客户数。

  avg_order_value:
    name_zh: 客单价
    type: ratio
    fact: orders
    ratio_grain: order
    numerator: SUM(order_items.price)
    denominator: COUNT(DISTINCT orders.order_id)
    grain_numerator: SUM(order_items.price)
    grain_denominator: "1"
    numerator_label: 商品销售额
    denominator_label: 订单数
    scope: { orders.order_status: delivered }
    time_via: orders.purchase_at
    additive: false
    unit: 元
    supported_grain: [none, month, category, seller, state, city]
    synonyms: [客单价, 平均订单金额, AOV]
    definition: 商品销售额 / 已送达订单数。

dimensions:
  category:
    name_zh: 品类
    join_path: [order_items -> products, products -> categories]
    column: categories.category_name_zh
    filter_column: categories.category_id
    filter_lookup: categories.category_name_zh
    value_source: categories
    synonyms: [品类, 类目, 分类, 商品类别, 商品种类]
  seller:
    name_zh: 商家
    join_path: [order_items -> sellers]
    column: sellers.seller_name
    filter_column: sellers.seller_id
    filter_lookup: sellers.seller_name
    value_source: sellers
    synonyms: [商家, 店铺, 卖家, 商户]
  product:
    name_zh: 商品
    join_path: [order_items -> products]
    column: products.product_name
    filter_column: products.product_id
    filter_lookup: products.product_name
    value_source: products
    synonyms: [商品, 产品, 单品]
  state:
    name_zh: 省份
    join_path: [orders -> customers]
    column: customers.customer_state
    filter_column: customers.customer_state
    synonyms: [省份, 地区, 州]
  city:
    name_zh: 城市
    join_path: [orders -> customers]
    column: customers.customer_city
    filter_column: customers.customer_city
    synonyms: [城市, 市]
  seller_state:
    name_zh: 商家所在省份
    join_path: [order_items -> sellers]
    column: sellers.seller_state
    filter_column: sellers.seller_state
    synonyms: [商家省份, 卖家地区]
  payment_type:
    name_zh: 支付方式
    join_path: [order_payments -> orders]
    column: order_payments.payment_type
    filter_column: order_payments.payment_type
    synonyms: [支付方式, 付款方式]
  order_status:
    name_zh: 订单状态
    column: orders.order_status
    filter_column: orders.order_status
    synonyms: [订单状态, 状态]
  month:
    name_zh: 月份
    kind: time
    format: "%Y-%m"
    column_from: metric.time_via
    synonyms: [月份, 按月, 月度]
  late:
    name_zh: 是否延迟
    kind: derived
    requires: orders
    expr: "orders.delivered_at > orders.estimated_delivery_at"
    labels: { "true": 延迟, "false": 准时 }
    synonyms: [是否延迟, 延迟, 准时]
  low_score:
    name_zh: 是否低分
    kind: derived
    requires: order_reviews
    expr: "order_reviews.review_score <= 2"
    labels: { "true": 低分, "false": 非低分 }
    synonyms: [是否低分, 低分, 差评]

policies:
  ambiguity: ask_once_then_remember
  missing_year: latest_occurrence_in_range
  ratio_grain: order
  max_retry: 1
