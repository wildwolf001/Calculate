[project]
name = "ecommerce-bi-agent"
version = "1.0.0"
description = "对话式经营分析 Agent（赛题一）"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
